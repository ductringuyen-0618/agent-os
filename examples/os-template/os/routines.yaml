defaults:
  model: sonnet
  # `default` with a narrow allowed_tools list is the read-only mode. `plan`
  # would refuse the mcp__agentos__* syscalls every skill depends on.
  permission_mode: default
  allowed_tools:
    - Read
    - Glob
    - Grep
    - WebFetch
    - WebSearch
  max_attempts: 2
  timeout_ms: 600000
routines:
  - name: heartbeat
    skill: heartbeat
    agent: ops
    every: 30m
    model: haiku
    allowed_tools:
      - mcp__agentos__emit_event
      - mcp__agentos__remember
      - mcp__agentos__schedule
      - mcp__agentos__read_wiki
  - name: techpulse-sync
    adapter: techpulse
    every: 1h
  - name: ingest
    skill: ingest
    agent: librarian
    on:
      - raw.added
    permission_mode: acceptEdits
    allowed_tools:
      - Read
      - mcp__agentos__remember
      - mcp__agentos__read_wiki
      - mcp__agentos__get_context
  - name: lint
    skill: lint
    agent: librarian
    cron: 0 3 * * *
    allowed_tools:
      - Read
      - Glob
      - Grep
      - mcp__agentos__remember
      - mcp__agentos__read_wiki
  - name: daily-digest
    skill: daily-digest
    agent: ops
    cron: 0 8 * * *
    after:
      - lint
    permission_mode: acceptEdits
    allowed_tools:
      - Read
      - Write
      - Glob
      - Grep
      - mcp__agentos__remember
      - mcp__agentos__read_wiki
workflows:
  max_concurrent: 2
